server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    access_log off;
    server_tokens off;

    location = / {
        return 302 /oa.html;
    }

    location /api/oa/v1/ {
        # Allow multipart framing. The Go application enforces the 10 MiB file limit.
        client_max_body_size 12m;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_pass http://api:8888;
    }

    location / {
        try_files $uri =404;
    }
}
