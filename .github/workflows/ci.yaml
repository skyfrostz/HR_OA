# Modified for HR OA on 2026-11-07. Original preserved in docs/upstream/gin-vue-admin-ci.yaml.
name: HR OA CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hr-oa-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: server/go.sum
      - run: go test -mod=readonly -race ./oa/...
      - run: go build -mod=readonly -o /tmp/hr-oa ./cmd/oa
  pure-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-pure-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Install locked dependencies
        id: install
        run: npx --yes pnpm@10.32.1 install --frozen-lockfile --ignore-scripts
      - name: Test OA interactions
        id: test
        run: npx --yes pnpm@10.32.1 run test
      # Keep independent diagnostics after a failed test without hiding its failure.
      - name: Check production entry types
        id: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx --yes pnpm@10.32.1 run typecheck
      - name: Build production entry
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx --yes pnpm@10.32.1 run build
      - name: Record independent check outcomes
        if: ${{ !cancelled() }}
        run: |
          {
            printf '%s\n' '## Pure Admin checks' '| Check | Outcome |' '| --- | --- |'
            printf '%s\n' '| Locked install | ${{ steps.install.outcome }} |'
            printf '%s\n' '| OA interaction tests | ${{ steps.test.outcome }} |'
            printf '%s\n' '| Production entry types | ${{ steps.typecheck.outcome }} |'
            printf '%s\n' '| Production build | ${{ steps.build.outcome }} |'
          } >> "$GITHUB_STEP_SUMMARY"
  h5:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:oa
      - run: npm run build:oa
